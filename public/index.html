<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Klinik Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#6366F1', secondary: '#0EA5E9' } } }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary">Klinik Enterprise</h1>
            <div class="space-x-4 text-sm font-medium text-gray-600">
                <a href="#" class="hover:text-primary">Pasien</a>
                <a href="#" class="hover:text-primary">Janji Temu</a>
                <a href="#" class="hover:text-primary">Resep</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm">Total Pasien</h3>
                <p class="text-3xl font-bold text-primary">1,284</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm">Janji Temu Hari Ini</h3>
                <p class="text-3xl font-bold text-secondary">24</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm">Resep Aktif</h3>
                <p class="text-3xl font-bold text-indigo-600">12</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-lg font-semibold">Daftar Pasien</h2>
                <button class="bg-primary text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700 transition">Tambah Pasien</button>
            </div>
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-gray-600 text-xs uppercase">
                    <tr>
                        <th class="px-6 py-4">Nama</th>
                        <th class="px-6 py-4">No Rekam Medis</th>
                        <th class="px-6 py-4">Tanggal Lahir</th>
                        <th class="px-6 py-4">Aksi</th>
                    </tr>
                </thead>
                <tbody id="patient-table" class="divide-y divide-gray-100">
                    <!-- Data injected via API -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/patients');
                const data = await res.json();
                const tbody = document.getElementById('patient-table');
                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td class="px-6 py-4 font-medium">${p.name}</td>
                        <td class="px-6 py-4">${p.medical_record_id}</td>
                        <td class="px-6 py-4">${p.dob}</td>
                        <td class="px-6 py-4 text-primary font-semibold cursor-pointer">Edit</td>
                    </tr>
                `).join('');
            } catch (e) { console.error('Fetch fail', e); }
        }
        fetchData();
    </script>
</body>
</html>
