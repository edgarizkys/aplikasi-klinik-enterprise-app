<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Klinik Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0EA5E9', secondary: '#14B8A6' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary">Klinik Enterprise</h1>
            <div class="space-x-4">
                <button class="text-gray-600 hover:text-primary">Dashboard</button>
                <button class="bg-primary text-white px-4 py-2 rounded-lg">Login</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500">Total Pasien</h3>
                <p class="text-3xl font-bold text-secondary">1,284</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500">Janji Hari Ini</h3>
                <p class="text-3xl font-bold text-primary">24</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500">Pendapatan</h3>
                <p class="text-3xl font-bold text-teal-600">Rp 12.5M</p>
            </div>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Antrian Pasien</h2>
                <button class="bg-secondary text-white px-4 py-2 rounded-lg">+ Tambah Janji</button>
            </div>
            <table class="w-full text-left">
                <thead>
                    <tr class="border-b border-gray-100">
                        <th class="pb-4">Nama Pasien</th>
                        <th class="pb-4">Dokter</th>
                        <th class="pb-4">Jadwal</th>
                        <th class="pb-4">Status</th>
                    </tr>
                </thead>
                <tbody id="appointment-list">
                    <tr class="border-b border-gray-50">
                        <td class="py-4">Budi Santoso</td>
                        <td class="py-4">Dr. Andi, Sp.A</td>
                        <td class="py-4">10:00 AM</td>
                        <td class="py-4"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">Menunggu</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
