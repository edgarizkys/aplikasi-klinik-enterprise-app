<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Klinik Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        secondary: '#10B981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="min-h-screen flex">
        <aside class="w-64 bg-white border-r border-gray-200">
            <div class="p-6 text-2xl font-bold text-primary">Klinik Enterprise</div>
            <nav class="mt-6">
                <a href="#" class="block py-2.5 px-6 text-gray-700 hover:bg-blue-50 border-l-4 border-primary">Dashboard</a>
                <a href="#" class="block py-2.5 px-6 text-gray-600 hover:bg-blue-50">Pasien</a>
                <a href="#" class="block py-2.5 px-6 text-gray-600 hover:bg-blue-50">Dokter</a>
                <a href="#" class="block py-2.5 px-6 text-gray-600 hover:bg-blue-50">Janji Temu</a>
                <a href="#" class="block py-2.5 px-6 text-gray-600 hover:bg-blue-50">Rekam Medis</a>
                <a href="#" class="block py-2.5 px-6 text-gray-600 hover:bg-blue-50">Faktur</a>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-semibold text-gray-800">Dashboard Klinik</h1>
                <button class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">Tambah Kunjungan</button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-500">Total Pasien</p>
                    <h3 class="text-3xl font-bold text-primary">1,284</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-500">Janji Temu Hari Ini</p>
                    <h3 class="text-3xl font-bold text-secondary">24</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-500">Pendapatan Hari Ini</p>
                    <h3 class="text-3xl font-bold text-gray-800">Rp 4.5M</h3>
                </div>
            </div>

            <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-semibold mb-4">Janji Temu Mendatang</h2>
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-400 border-b">
                            <th class="pb-3">Pasien</th>
                            <th class="pb-3">Dokter</th>
                            <th class="pb-3">Waktu</th>
                            <th class="pb-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="appointment-list">
                        <!-- Data injected via JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
