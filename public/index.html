<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Klinik Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0EA5E9', secondary: '#14B8A6' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary">Klinik Enterprise</h1>
            <div class="space-x-4">
                <button class="text-gray-600 hover:text-primary">Pasien</button>
                <button class="text-gray-600 hover:text-primary">Dokter</button>
                <button class="bg-primary text-white px-4 py-2 rounded-lg">Janji Temu</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Total Pasien</p>
                <h2 class="text-3xl font-bold text-secondary">1,284</h2>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Antrian Hari Ini</p>
                <h2 class="text-3xl font-bold text-primary">24</h2>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500">Pendapatan (Bulan Ini)</p>
                <h2 class="text-3xl font-bold text-secondary">Rp 45.2M</h2>
            </div>
        </div>

        <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <h3 class="text-lg font-semibold mb-4">Daftar Janji Temu</h3>
            <table class="w-full text-left">
                <thead>
                    <tr class="text-gray-400 border-b">
                        <th class="pb-3">Pasien</th>
                        <th class="pb-3">Dokter</th>
                        <th class="pb-3">Jadwal</th>
                        <th class="pb-3">Status</th>
                    </tr>
                </thead>
                <tbody id="appointment-list">
                    <tr class="border-b">
                        <td class="py-4">Budi Santoso</td>
                        <td class="py-4">Dr. Andi, Sp.A</td>
                        <td class="py-4">2026-07-28 09:00</td>
                        <td class="py-4"><span class="bg-blue-100 text-primary px-2 py-1 rounded text-xs">Menunggu</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
