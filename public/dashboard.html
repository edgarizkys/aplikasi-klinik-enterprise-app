<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aplikasi Klinik Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent-from: #14B8A6; --accent-to: #0EA5E9; }
        .gradient-nav { background: linear-gradient(to right, var(--accent-from), var(--accent-to)); }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="gradient-nav text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl">Klinik Enterprise</h1>
            <div class="space-x-4">
                <button onclick="render('patients')" class="hover:underline">Pasien</button>
                <button onclick="render('appointments')" class="hover:underline">Janji</button>
                <button onclick="render('doctors')" class="hover:underline">Dokter</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <div id="app-content" class="bg-white p-6 rounded-xl shadow-sm">
            <h2 id="view-title" class="text-2xl font-bold mb-4">Dashboard</h2>
            <div id="data-table" class="overflow-x-auto">
                <!-- Dynamic Content -->
            </div>
        </div>
    </main>

    <script>
        const state = {
            patients: [],
            appointments: [],
            doctors: []
        };

        async function fetchData(entity) {
            const res = await fetch(`/api/${entity}`);
            state[entity] = await res.json();
            render(entity);
        }

        function render(entity) {
            document.getElementById('view-title').innerText = entity.toUpperCase();
            const container = document.getElementById('data-table');
            const data = state[entity];
            
            let html = `<table class="w-full text-left"><thead><tr class="border-b">`;
            if(data.length > 0) {
                Object.keys(data[0]).forEach(key => html += `<th class="p-2">${key}</th>`);
                html += `</tr></thead><tbody>`;
                data.forEach(row => {
                    html += `<tr class="border-b">`;
                    Object.values(row).forEach(val => html += `<td class="p-2">${val}</td>`);
                    html += `</tr>`;
                });
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        fetchData('patients');
    </script>
</body>
</html>
