<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aplikasi Klinik Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563EB', secondary: '#10B981' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-900 text-white p-6">
            <h2 class="text-2xl font-bold mb-10 text-secondary">Klinik Enterprise</h2>
            <nav class="space-y-4">
                <a href="#" class="block py-2 px-4 bg-primary rounded">Dashboard</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800">Pasien</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800">Dokter</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800">Janji Temu</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800">Rekam Medis</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800">Faktur</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Ringkasan Operasional</h1>
                <button class="bg-secondary text-white px-6 py-2 rounded-lg shadow-lg">+ Tambah Data</button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-primary">
                    <p class="text-gray-500">Total Pasien</p>
                    <h3 class="text-2xl font-bold">1,284</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-secondary">
                    <p class="text-gray-500">Janji Temu Hari Ini</p>
                    <h3 class="text-2xl font-bold">24</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-400">
                    <p class="text-gray-500">Dokter Aktif</p>
                    <h3 class="text-2xl font-bold">12</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500">
                    <p class="text-gray-500">Faktur Tertunda</p>
                    <h3 class="text-2xl font-bold">8</h3>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <h3 class="text-xl font-bold mb-4">Janji Temu Terbaru</h3>
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-400 border-b">
                            <th class="pb-3">Pasien</th>
                            <th class="pb-3">Dokter</th>
                            <th class="pb-3">Waktu</th>
                            <th class="pb-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="appointment-table">
                        <!-- Data injected via app.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
